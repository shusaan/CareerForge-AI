services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: careerforge-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - careerforge-network

  db:
    image: postgres:16-alpine
    container_name: careerforge-db
    profiles:
      - with-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=careerforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - careerforge-network

volumes:
  pgdata:

networks:
  careerforge-network:
    driver: bridge
